<div class="modal" id="createMultidayModal" aria-hidden="true">
  <div class="modal-dialog">
    <form method="post" action="{{ url_for('jobs.create_multiday') }}">
      {{ csrf_token() }}

      {% set date_val = '' %}
      {% if selected_date is defined and selected_date %}
        {% set date_val = selected_date %}
      {% elif date is defined and date %}
        {% set date_val = date %}
      {% endif %}

      <header class="modal-header">
        <h3>Create multi-day job</h3>
        <button type="button" class="close" data-dismiss="modal">&times;</button>
      </header>

      <div class="modal-body">
        <label>Title
          <input type="text" name="title" required>
        </label>

        <div class="grid two">
          <label>Start date
            <input type="date" name="start_date" required value="{{ date_val }}">
          </label>
          <label>End date
            <input type="date" name="end_date" required value="{{ date_val }}">
          </label>
        </div>

        <div class="grid two">
          <label>Assign to
            <select name="assigned_to">
              <option value="">— Unassigned —</option>
              {% for tech in techs %}
                <option value="{{ tech.id }}">{{ tech.name }}</option>
              {% endfor %}
            </select>
          </label>
          <label>Assignment
            <select name="assignment_mode">
              <option value="single">Single</option>
              <option value="both">2 Techs</option>
            </select>
          </label>
        </div>

        <label>Price
          <input type="number" step="0.01" name="price">
        </label>

        <div class="grid two">
          <label>REI ZIP <input type="text" name="rei_zip" pattern="\d{5}"></label>
          <label>REI City <input type="text" name="rei_city"></label>
        </div>

        <label>Notes
          <textarea name="notes" rows="3"></textarea>
        </label>
      </div>

      <footer class="modal-footer">
        <button type="button" class="btn ghost" data-dismiss="modal">Cancel</button>
        <button type="submit" class="btn primary">Create</button>
      </footer>
    </form>
  </div>
</div>
